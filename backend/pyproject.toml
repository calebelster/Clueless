[project]
name = "clueless-backend"
version = "0.1.0"
description = "Clue-Less server: Flask game engine, WebSocket communication, Firebase auth/Firestore"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "flask-sock>=0.7",
    "flask-cors>=6.0",
    "firebase-admin>=7.0",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "requests>=2.32",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
