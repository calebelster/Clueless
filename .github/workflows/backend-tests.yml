name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v
